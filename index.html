<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GIT | Login</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://kit.fontawesome.com/9b013527cf.js" crossorigin="anonymous"></script>
    <link rel="shortcut icon" href="assets/github-logo.png" type="image/x-icon">
</head>
<body>
    <div class="flex min-h-screen items-center justify-center bg-slate-50 px-4">
  <div class="w-full max-w-md rounded-lg bg-white p-6 shadow-md">
    <div class="text-center">
      <img
        src="assets/github-logo.png"
        alt="GitHub"
        class="mx-auto h-20 w-20"
      />

      <h1 class="mt-3 text-2xl font-bold text-slate-800">
        GitHub Issues Tracker
      </h1>

      <p class="text-sm text-slate-500">
        Sign in to manage your issues
      </p>
    </div>

    <form  onSubmit={handleSignBtn} id="login-form" class="mt-5 space-y-4">
      <div>

        <label class="mb-2 block text-sm font-medium">
          Username
        </label>

        <input id="user-name" type="text"
          placeholder="Enter Username"
          class="input font-semibold input-bordered w-full"/>
        <p class="mt-1 text-sm font-semibold text-violet-600">
          Default: admin
        </p>
      </div>

      <div>
        <label class="mb-2 block text-sm font-semibold">
          Password
        </label>

        <input id="password"
          type="password"
          placeholder="Enter Password"
          class="input font-semibold input-bordered w-full"
        />

        <p class="mt-1 text-sm font-semibold text-violet-600">
          Default: admin123
        </p>
      </div>

      <button
       onsubmit="handleSignBtn"
        type="submit"
        class="btn w-full border-0 bg-violet-600 text-white hover:bg-violet-700"
      >
        Sign In
      </button>
    </form>

    <div class="my-6 flex items-center gap-2">
      <div class="h-px flex-1 bg-slate-200"></div>
      <span class="text-sm text-slate-500">OR</span>
      <div class="h-px flex-1 bg-slate-200"></div>
    </div>

    <div class="text-center">
      <p class="mb-2 text-xs text-slate-500">
        Demo Credentials:
      </p>

      <div class="rounded-lg bg-slate-50 p-5 text-sm">
        <p><strong>Username:</strong> admin</p>
        <p><strong>Password:</strong> admin123</p>
      </div>
    </div>
  </div>
</div>

<script src="script/index.js"></script>
</body>
</html>
